feign-client:
  url:
    bank-service: ${BANK_SERVICE_PROD_URL_PORT}
    chat-service: ${CHAT_SERVICE_PROD_URL_PORT}
    auth-service: ${AUTH_SERVICE_PROD_URL_PORT}

kafka:
  bootstrap-servers: ${KAFKA_PROD_BOOTSTRAP_SERVERS}

spring:
  datasource:
    url: jdbc:mysql://${HAETSAL_PROD_DB_IP}:${HAETSAL_PROD_DB_PORT}/${HAETSAL_PROD_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${HAETSAL_PROD_DB_USERNAME}
    password: ${HAETSAL_PROD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver