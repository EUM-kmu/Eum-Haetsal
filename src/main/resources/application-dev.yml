feign-client:
  url:
    bank-service: ${BANK_SERVICE_DEV_URL_PORT}
    chat-service: ${CHAT_SERVICE_DEV_URL_PORT}
    auth-service: ${AUTH_SERVICE_DEV_URL_PORT}

kafka:
  bootstrap-servers: ${KAFKA_DEV_BOOTSTRAP_SERVERS}

spring:
  datasource:
    url: jdbc:mysql://${HAETSAL_DEV_DB_IP}:${HAETSAL_DEV_DB_PORT}/${HAETSAL_DEV_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${HAETSAL_DEV_DB_USERNAME}
    password: ${HAETSAL_DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver