name: Dev action

on:
  push:
    branches:
      - dev
      - dev-temp

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.set_short_sha.outputs.short_sha }}

    steps:
    - uses: actions/checkout@v4

    - name: Set Short Commit SHA
      id: set_short_sha
      run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

#    - name: Set YML
#      run: |
#        echo "${{ secrets.APPLICATION_YML }}" | base64 --decode > src/main/resources/application.yml
#        find src

    - name: Build with Gradle Wrapper
      run: ./gradlew build -x test

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME_TEST }}
        password: ${{ secrets.DOCKERHUB_PASSWORD_TEST }}

    - name: Docker Image Build
#      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME_TEST }}/eum-dev:haetsal
      run: |
        docker build -t ${{ secrets.DOCKER_REPO_TEST }}:${{ steps.set_short_sha.outputs.short_sha }} .
        docker tag ${{ secrets.DOCKER_REPO_TEST }}:${{ steps.set_short_sha.outputs.short_sha }} ${{ secrets.DOCKER_REPO_TEST }}:latest

    - name: Docker Hub push
#      run: docker push ${{ secrets.DOCKERHUB_USERNAME_TEST }}/eum-dev:haetsal
      run: |
        docker push ${{ secrets.DOCKER_REPO_TEST }}:${{ steps.set_short_sha.outputs.short_sha }}
        docker push ${{ secrets.DOCKER_REPO_TEST }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
#      - name: Login to Docker Hub
#        run: sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME_TEST }} -p ${{ secrets.DOCKERHUB_PASSWORD_TEST }}
      -  name: Deploy
         uses: appleboy/ssh-action@master
         with:
          host: ${{ secrets.DEV_SSH_IP }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
#          port: 22
          script: |
            set -e
            docker login -u ${{ secrets.DOCKERHUB_USERNAME_TEST }} -p ${{ secrets.DOCKERHUB_PASSWORD_TEST }}
            docker pull ${{ secrets.DOCKER_REPO_TEST }}:${{ needs.build.outputs.short_sha }}
            docker rm -f haetsal || true
            cd dev-haetsal
            echo "${{ secrets.SPRING_ENV }}" > .env
            docker run -d -p 8000:8000 --network root_eum_network --name haetsal --env-file .env ${{ secrets.DOCKER_REPO_TEST }}:${{ needs.build.outputs.short_sha }}
